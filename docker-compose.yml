services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: ./api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${API_PORT}
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && npm run dev"

  client:
    build: .
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql_data: